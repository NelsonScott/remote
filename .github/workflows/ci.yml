name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: fmt, clippy, tests (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Toolchain and GTK headers
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust clippy rustfmt gtk4-devel libadwaita-devel \
            desktop-file-utils appstream git
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Desktop file and AppStream metadata
        run: |
          desktop-file-validate data/xyz.scottnelson.Remote.desktop
          appstreamcli validate --no-net data/xyz.scottnelson.Remote.metainfo.xml

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: remote.flatpak
          manifest-path: packaging/flatpak/xyz.scottnelson.Remote.json
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: remote.flatpak
      - uses: softprops/action-gh-release@v2
        with:
          files: remote.flatpak
          generate_release_notes: true
